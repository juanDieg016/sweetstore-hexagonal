quarkus.application.name=sweetstore-hexagonal

quarkus.banner.enabled=false
quarkus.http.port=8080


# ==============================
# MYSQL
# ==============================

quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=

quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/sweetstore?createDatabaseIfNotExist=true


# ==============================
# JPA / HIBERNATE
# ==============================

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.log.sql=true


# ==============================
# SWAGGER
# ==============================

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

quarkus.smallrye-openapi.info-title=SweetStore
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=Sistema de inventario para una tienda de dulces

# ==============================
# ADMINISTRADOR
# ==============================

sweetstore.admin.username=admin
sweetstore.admin.password=admin123
