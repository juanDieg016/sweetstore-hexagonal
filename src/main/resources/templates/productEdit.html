<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SweetStore | Editar producto</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: linear-gradient(135deg,#fff8fc,#f5edff);
            font-family: Inter, Arial, sans-serif;
            color: #35163d;
        }

        .topbar {
            background: linear-gradient(90deg,#8e3183,#cf358f);
            color: white;
            padding: 18px 30px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .card {
            border: 0;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(92,45,100,.09);
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            min-height: 48px;
        }

        textarea.form-control {
            min-height: 120px;
        }

        .btn-sweet {
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            background: linear-gradient(90deg,#db328e,#a53ba7);
        }

        .btn-sweet:hover {
            color: white;
        }

        .stock-box {
            background: #f8f1fb;
            border-radius: 16px;
            padding: 18px;
        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="container
                d-flex
                justify-content-between
                align-items-center">

        <div class="brand">
            🍭 SweetStore
        </div>

        <a href="/products"
           class="btn btn-light btn-sm">

            <i class="bi bi-arrow-left"></i>

            Volver a productos

        </a>

    </div>

</header>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">


            <div class="mb-4">

                <h1 class="fw-bold">
                    Editar producto
                </h1>

                <p class="text-muted">
                    Actualiza la información del producto.
                </p>

            </div>


            {#if error}

                <div class="alert alert-danger">

                    <i class="bi bi-exclamation-circle me-2"></i>

                    {error}

                </div>

            {/if}


            <div class="card">

                <div class="card-body p-4 p-md-5">


                    <form
                            action="/products/{product.id}"
                            method="post">


                        <div class="row g-4">


                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Nombre
                                </label>

                                <input
                                        type="text"
                                        name="name"
                                        value="{product.name}"
                                        class="form-control"
                                        required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Categoría
                                </label>

                                <select
                                        name="categoryId"
                                        class="form-select"
                                        required>


                                    {#for category in categories}

                                        <option
                                                value="{category.id}"
                                        {#if category.id == product.category.id}
                                            selected
                                                {/if}>

                                            {category.name}

                                        </option>

                                    {/for}


                                </select>

                            </div>


                            <div class="col-12">

                                <label class="form-label fw-bold">
                                    Descripción
                                </label>

                                <textarea
                                        name="description"
                                        class="form-control">{product.description}</textarea>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Precio
                                </label>

                                <input
                                        type="number"
                                        step="0.01"
                                        min="0.01"
                                        name="price"
                                        value="{product.price}"
                                        class="form-control"
                                        required>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-bold">
                                    Stock mínimo
                                </label>

                                <input
                                        type="number"
                                        min="0"
                                        name="minimumStock"
                                        value="{product.minimumStock}"
                                        class="form-control"
                                        required>

                            </div>


                            <div class="col-12">

                                <div class="stock-box">

                                    <div class="d-flex
                                                justify-content-between
                                                align-items-center">

                                        <div>

                                            <small class="text-muted">
                                                Stock actual
                                            </small>

                                            <div class="fs-3 fw-bold">
                                                {product.stock}
                                            </div>

                                        </div>

                                        <div class="text-muted">

                                            <i class="bi bi-info-circle me-1"></i>

                                            El stock se modifica desde Movimientos.

                                        </div>

                                    </div>

                                </div>

                            </div>


                        </div>


                        <div class="d-flex
                                    justify-content-end
                                    gap-2
                                    mt-5">

                            <a
                                    href="/products"
                                    class="btn btn-light">

                                Cancelar

                            </a>

                            <button
                                    type="submit"
                                    class="btn btn-sweet px-4">

                                <i class="bi bi-floppy me-1"></i>

                                Guardar cambios

                            </button>

                        </div>


                    </form>


                </div>

            </div>


        </div>

    </div>

</main>

</body>

</html>
