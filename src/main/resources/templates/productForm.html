<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SweetStore | Nuevo producto</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: linear-gradient(135deg,#fff6fb,#f5edff);
            font-family: Inter, Arial, sans-serif;
            color: #35163d;
        }

        .topbar {
            background: linear-gradient(90deg,#8f3185,#d33790);
            color: white;
            padding: 18px 30px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .form-card {
            border: 0;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(91,44,98,.10);
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            min-height: 48px;
        }

        textarea.form-control {
            min-height: 120px;
        }

        .btn-sweet {
            border: 0;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            padding: 12px 25px;
            background: linear-gradient(90deg,#db328e,#a53ba7);
        }

        .btn-sweet:hover {
            color: white;
        }

        .illustration {
            min-height: 100%;
            border-radius: 22px;
            padding: 40px;
            background:
                    radial-gradient(
                            circle at 50% 20%,
                            #ffd5eb,
                            transparent 45%
                    ),
                    linear-gradient(
                            145deg,
                            #fbebff,
                            #fff1f8
                    );

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .candy {
            font-size: 110px;
        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="container d-flex
                justify-content-between
                align-items-center">

        <div class="brand">

            🍭 SweetStore

        </div>


        <a
                href="/"
                class="btn btn-light btn-sm">

            <i class="bi bi-arrow-left"></i>

            Volver al inventario

        </a>

    </div>

</header>


<main class="container py-5">


    <div class="mb-4">

        <h1 class="fw-bold">

            Nuevo producto

        </h1>

        <p class="text-muted">

            Registra un nuevo dulce
            en el inventario.

        </p>

    </div>


    {#if error}

        <div class="alert alert-danger">

            {error}

        </div>

    {/if}


    <div class="row g-4">


        <div class="col-lg-8">


            <div class="card form-card">

                <div class="card-body p-4 p-md-5">


                    <form
                            action="/products"
                            method="post">


                        <div class="row g-4">


                            <div class="col-md-6">


                                <label class="form-label fw-bold">

                                    Nombre *

                                </label>


                                <input
                                        type="text"
                                        name="name"
                                        class="form-control"
                                        placeholder="Ej. Gomitas de ositos"
                                        required>


                            </div>


                            <div class="col-md-6">


                                <label class="form-label fw-bold">

                                    Categoría *

                                </label>


                                <select
                                        name="categoryId"
                                        class="form-select"
                                        required>


                                    <option value="">

                                        Selecciona una categoría

                                    </option>


                                    {#for category in categories}

                                        <option value="{category.id}">

                                            {category.name}

                                        </option>

                                    {/for}


                                </select>


                                <div class="form-text">

                                    ¿No existe?

                                    <a href="/categories">

                                        Crear categoría

                                    </a>

                                </div>


                            </div>


                            <div class="col-12">


                                <label class="form-label fw-bold">

                                    Descripción

                                </label>


                                <textarea
                                        name="description"
                                        class="form-control"
                                        placeholder="Describe el producto...">
                                </textarea>


                            </div>


                            <div class="col-md-4">


                                <label class="form-label fw-bold">

                                    Precio *

                                </label>


                                <input
                                        type="number"
                                        step="0.01"
                                        min="0.01"
                                        name="price"
                                        class="form-control"
                                        required>


                            </div>


                            <div class="col-md-4">


                                <label class="form-label fw-bold">

                                    Stock inicial *

                                </label>


                                <input
                                        type="number"
                                        min="0"
                                        name="stock"
                                        class="form-control"
                                        required>


                            </div>


                            <div class="col-md-4">


                                <label class="form-label fw-bold">

                                    Stock mínimo *

                                </label>


                                <input
                                        type="number"
                                        min="0"
                                        name="minimumStock"
                                        class="form-control"
                                        required>


                            </div>


                        </div>


                        <div class="d-flex
                                    justify-content-end
                                    gap-2
                                    mt-5">


                            <a
                                    href="/"
                                    class="btn btn-light">

                                Cancelar

                            </a>


                            <button
                                    type="submit"
                                    class="btn btn-sweet">

                                <i class="bi bi-floppy me-1"></i>

                                Guardar producto

                            </button>


                        </div>


                    </form>


                </div>

            </div>


        </div>


        <div class="col-lg-4">


            <div class="illustration">


                <div class="candy">

                    🍬

                </div>


                <h3 class="fw-bold">

                    ¡Agrega un nuevo dulce!

                </h3>


                <p class="text-muted">

                    Mantén actualizado el inventario
                    para saber exactamente qué tienes
                    disponible.

                </p>


            </div>


        </div>


    </div>


</main>

</body>

</html>
