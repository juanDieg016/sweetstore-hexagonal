<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>SweetStore | Categorías</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: linear-gradient(135deg,#fff8fc,#f8f2ff);
            font-family: Inter, Arial, sans-serif;
            color: #35163d;
        }

        .topbar {
            background: linear-gradient(90deg,#8f3185,#d33790);
            color: white;
            padding: 18px 30px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .card {
            border: 0;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(91,44,98,.08);
        }

        .btn-sweet {
            border: 0;
            color: white;
            font-weight: 700;
            border-radius: 14px;
            background: linear-gradient(90deg,#db328e,#a53ba7);
        }

        .btn-sweet:hover {
            color: white;
        }

        .form-control {
            border-radius: 14px;
        }

        .category-item {
            padding: 16px 0;
            border-bottom: 1px solid #f2e8f4;
        }

    </style>

</head>


<body>


<header class="topbar">

    <div class="container d-flex
                justify-content-between
                align-items-center">

        <div class="brand">
            🍭 SweetStore
        </div>

        <a href="/"
           class="btn btn-light btn-sm">

            <i class="bi bi-arrow-left"></i>
            Volver

        </a>

    </div>

</header>


<main class="container py-5">


    <div class="row g-4">


        <!-- FORMULARIO -->

        <div class="col-lg-5">


            <div class="card">

                <div class="card-body p-4">


                    <h3 class="fw-bold mb-2">

                        Nueva categoría

                    </h3>

                    <p class="text-muted">

                        Organiza tus productos
                        por tipo de dulce.

                    </p>


                    {#if error}

                        <div class="alert alert-danger">

                            {error}

                        </div>

                    {/if}


                    <form
                            action="/categories"
                            method="post">


                        <div class="mb-3">

                            <label class="form-label fw-bold">

                                Nombre

                            </label>

                            <input
                                    type="text"
                                    class="form-control"
                                    name="name"
                                    placeholder="Ej. Chocolates"
                                    required>

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Descripción

                            </label>

                            <textarea
                                    class="form-control"
                                    name="description"
                                    rows="4"
                                    placeholder="Describe la categoría...">
                            </textarea>

                        </div>


                        <button
                                type="submit"
                                class="btn btn-sweet w-100">

                            <i class="bi bi-plus-lg me-1"></i>

                            Crear categoría

                        </button>

                    </form>


                </div>

            </div>


        </div>


        <!-- LISTADO -->

        <div class="col-lg-7">


            <div class="card">

                <div class="card-body p-4">


                    <h3 class="fw-bold mb-3">

                        Categorías registradas

                    </h3>


                    {#if categories.isEmpty}

                        <div class="text-center
                                    text-muted
                                    py-5">

                            <i class="bi bi-tags
                                      fs-1"></i>

                            <p class="mt-3 mb-0">

                                No hay categorías registradas.

                            </p>

                        </div>


                    {#else}


                        {#for category in categories}


                            <div class="category-item">


                                <div class="d-flex
                                            justify-content-between
                                            align-items-start">


                                    <div>

                                        <div class="fw-bold">

                                            {category.name}

                                        </div>

                                        <small class="text-muted">

                                            {category.description}

                                        </small>

                                    </div>


                                    <span class="badge
                                                 rounded-pill
                                                 text-bg-light">

                                        #{category.id}

                                    </span>


                                </div>


                            </div>


                        {/for}


                    {/if}


                </div>

            </div>


        </div>


    </div>


</main>

</body>

</html>
